[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.2.0"
description = "Framework-independent security gateway for agent tool requests"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
